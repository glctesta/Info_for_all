<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info For All</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Header -->
    <header id="header">
        <img src="/img/Logo.png" alt="Logo" class="header-logo">
        <div id="clock" class="clock">00:00:00</div>
    </header>

    <!-- Main content area -->
    <main id="content-area">
        <div id="slide-container">
            <!-- Slides aggiunti dinamicamente da JS -->
        </div>
    </main>

    <!-- Progress bar -->
    <div id="progress-bar-container">
        <div id="progress-bar"></div>
    </div>

    <!-- Navigation dots -->
    <div id="nav-dots"></div>

    <!-- Footer -->
    <footer id="footer">
        <div class="footer-left">
            <span id="footer-monitor-name" class="footer-monitor-name"></span>
        </div>
        <div class="footer-right">
            <span class="powered-by">Powered by GTMC</span>
            <img src="/img/gtmcLogo.jpg" alt="GTMC" class="footer-logo">
        </div>
    </footer>

    <!-- ===== BREAK OVERLAY (5 fasi) ===== -->
    <div id="break-overlay" class="break-overlay hidden">

        <!-- FASE 1 & 4: Orologio analogico + countdown -->
        <div id="phase-clock" class="phase-panel hidden">
            <div class="analog-clock-wrapper">
                <svg id="analog-clock" viewBox="0 0 300 300" class="analog-clock">
                    <circle cx="150" cy="150" r="145" class="clock-face"/>
                    <circle cx="150" cy="150" r="140" class="clock-inner"/>
                    <g id="clock-markers"></g>
                    <line id="hand-hour" class="hand hand-hour" x1="150" y1="150" x2="150" y2="70"/>
                    <line id="hand-minute" class="hand hand-minute" x1="150" y1="150" x2="150" y2="40"/>
                    <line id="hand-second" class="hand hand-second" x1="150" y1="150" x2="150" y2="30"/>
                    <circle cx="150" cy="150" r="5" class="clock-center"/>
                </svg>
                <div id="clock-countdown" class="clock-countdown">30</div>
            </div>
            <div id="phase-clock-label" class="phase-label">Pauză în...</div>
            <div id="clock-departments" class="clock-departments">
                <div id="clock-departments-track" class="clock-departments-track"></div>
            </div>
        </div>

        <!-- Audio gong -->
        <audio id="gong-audio" src="/static/audio/gong.mp3" preload="auto"></audio>

        <!-- FASE 2 & 5: Reparti/Motivo/Immagine + Suono -->
        <div id="phase-announce" class="phase-panel hidden">
            <div id="announce-reason-image" class="announce-reason-image"></div>
            <div id="announce-type" class="announce-type"></div>
            <div id="announce-reason" class="announce-reason"></div>
            <div id="announce-time-range" class="announce-time-range"></div>
            <div class="announce-section-title">Departamente autorizate pentru pauză</div>
            <div id="announce-departments" class="announce-departments"></div>
        </div>

        <!-- FASE 3: Documento (TextToshow) alternato con lista reparti -->
        <div id="phase-document" class="phase-panel hidden">
            <!-- Countdown rimanente sovrapposto -->
            <div id="doc-countdown" class="doc-countdown"></div>
            <!-- Vista PDF -->
            <div id="doc-pdf-view" class="doc-view">
                <iframe id="break-document-frame" class="break-document-frame"></iframe>
            </div>
            <!-- Vista reparti (alternata) -->
            <div id="doc-dept-view" class="doc-view hidden">
                <div id="doc-reason-image" class="doc-reason-image-small"></div>
                <div id="doc-reason-text" class="doc-reason-text"></div>
                <div class="announce-section-title">Departamente în pauză</div>
                <div id="doc-departments" class="announce-departments"></div>
            </div>
        </div>

    </div>

    <script src="/static/js/app.js" defer></script>
</body>
</html>
